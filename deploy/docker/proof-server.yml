# Local proof server for deploying to Preprod or Preview.
# Adapted from midnight-js testkit-js (Apache-2.0, Midnight Foundation).
# Version from Midnight's support matrix (October 2026).
services:
  proof-server:
    image: "midnightntwrk/proof-server:8.1.3"
    container_name: "proof-server_$TESTCONTAINERS_UID"
    command: ['midnight-proof-server --verbose']
    # Reachable from this machine only: the oracle's secret key passes through it.
    ports:
      - target: 6300
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
