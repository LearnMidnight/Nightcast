# A throwaway local Midnight network (node, indexer, proof server) for
# end-to-end tests. Adapted from midnight-js testkit-js (Apache-2.0,
# Midnight Foundation); versions from Midnight's support matrix (Preview, October 2026).
services:
  proof-server:
    image: "midnightntwrk/proof-server:8.1.3"
    container_name: proof-server_$TESTCONTAINERS_UID
    command: ['midnight-proof-server --verbose']
    ports:
      - '6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: "midnightntwrk/indexer-standalone:4.3.5"
    container_name: indexer_$TESTCONTAINERS_UID
    ports:
      - '8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      # The built-in SPO indexer needs the node too. Left at its default
      # (localhost) it retries for about 5 minutes, then exits and takes the
      # whole indexer down with it.
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'dummy-not-using-spo'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: "midnightntwrk/midnight-node:1.0.400"
    container_name: node_$TESTCONTAINERS_UID
    ports:
      - '9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
