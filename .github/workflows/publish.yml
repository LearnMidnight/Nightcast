name: Publish to npm

# Publishes @nightcast/contract and @nightcast/sdk from main, built and tested
# here, with npm provenance (each version on npmjs.com links back to this
# workflow run and commit). Run it by hand: Actions → Publish to npm → Run
# workflow. Leave "Dry run" ticked first to see exactly what would go out.
# No token: npm trusts this workflow directly (trusted publishing, set on each
# package's settings page on npmjs.com), and only to *stage* a release: it goes
# live when an owner approves it with 2FA (npmjs.com → Staged Packages, or
# `npm stage approve <id>`). See docs/PUBLISHING.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test and pack, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

env:
  COMPACT_TOOLCHAIN: 0.31.1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main only (this is ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing and `npm stage` need npm 11.15.0 or later (Node 22 comes with npm 10).
      - name: npm 11
        run: |
          npm install -g npm@11
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.log(`::error::npm ${process.argv[1]} is too old for npm stage (11.15.0+)`); process.exit(1) }' "$(npm --version)"
          echo "::notice title=npm::$(npm --version)"

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select compiler ${{ env.COMPACT_TOOLCHAIN }}
        run: compact update "$COMPACT_TOOLCHAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contract (with proving keys)
        run: npm run compact

      - name: Build
        run: npm run build

      - name: Test
        run: |
          (cd contract && npx vitest run)
          (cd sdk && npx vitest run)

      - name: Verifier key fingerprints
        run: |
          node deploy/dist/cli.js fingerprints | tee fingerprints.json
          node -e '
            const f = require("./fingerprints.json");
            for (const [c, h] of Object.entries(f.verifierKeys)) console.log(`::notice title=fingerprint ${c}::${h}`);
          '

      - name: Check what would be published
        run: |
          npm pack -w @nightcast/contract -w @nightcast/sdk --dry-run --json > pack.json
          node scripts/check-pack.mjs pack.json

      - name: Versions not on npm yet
        run: |
          for p in contract sdk; do
            name=$(node -p "require('./$p/package.json').name"); version=$(node -p "require('./$p/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "::error title=$name::$version is already on npm: raise the version in $p/package.json (and sdk's dependency on the contract) first"
              exit 1
            fi
            echo "::notice title=$name::will publish $version"
          done

      # Stages both versions for approval; nothing is public until an owner
      # approves them with 2FA. Approve the contract before the SDK (the SDK
      # depends on it).
      - name: Stage for approval ${{ inputs.dry_run && '(dry run)' || '' }}
        env:
          # setup-node sets a placeholder token, and npm then sends that instead of asking GitHub who
          # this workflow is: both packages were refused with E401 on 12 Nov 2026. Empty lets trusted
          # publishing work; the NPM_TOKEN secret, if one is ever set (docs/PUBLISHING.md), is used.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
        run: |
          # a refused package must fail the step, not vanish behind tee
          set -o pipefail
          flags="--access public --provenance"
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          # When npm refuses, say why: its log records how the trusted-publishing exchange went
          # ("need auth" alone doesn't say whether npmjs.com has no trusted publisher for the package,
          # or one that names another repository or workflow).
          stage() {
            npm stage publish -w "$1" $flags | tee "$2" && return 0
            echo "::error title=$1::npm refused it. What npm's log says about trusted publishing (nothing below means it never tried):"
            grep -h -i "oidc" "$HOME"/.npm/_logs/*-debug-0.log | sed -E 's/^[0-9]+ //' | tail -12 || true
            echo "Check on npmjs.com: the package's Settings, Trusted Publisher: GitHub Actions, ${{ github.repository_owner }}, ${{ github.event.repository.name }}, publish.yml, no environment."
            return 1
          }
          stage @nightcast/contract stage-contract.txt
          stage @nightcast/sdk stage-sdk.txt
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::notice title=Staged::Approve on npmjs.com → Staged Packages (contract first, then sdk), or: npm stage approve <id>"
          fi
