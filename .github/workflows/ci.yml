name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versions from Midnight's support matrix (Preview, Preprod and Mainnet, ledger 8).
  COMPACT_TOOLCHAIN: 0.31.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select compiler ${{ env.COMPACT_TOOLCHAIN }}
        run: |
          compact update "$COMPACT_TOOLCHAIN"
          compact compile --version
          compact compile --language-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile contract (with proving keys)
        run: npm run compact

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test contract
        working-directory: contract
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=../reports/contract.json

      - name: Test SDK
        working-directory: sdk
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=../reports/sdk.json

      - name: Summarise tests
        if: always()
        run: |
          for f in reports/*.json; do
            [ -f "$f" ] || continue
            node -e '
              const r = require(process.argv[1]);
              const name = process.argv[1].split("/").pop().replace(".json", "");
              console.log(`::notice title=${name} tests::${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numTotalTests} total`);
            ' "$PWD/$f"
          done
